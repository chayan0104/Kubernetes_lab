#scale : kubectl scale deployment nginx-deployment --replicas=5 -n nginx-ns
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: nginx-ns

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

  spec:
    containers:
      - name: nginx
        image: nginx:latest
        ports:
            - containerPort: 80           