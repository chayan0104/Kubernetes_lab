#scale : kubectl scale deployment nginx-deployment --replicas=5 -n nginx-ns
apiVersion: batch/v1
kind: Job

metadata:
  name: demo-job
  namespace: nginx-ns

spec:
  completions: 2
  parallelism: 1

  template:
    metadata:
      name: demo-job-pod
      labels:
        app: batch-task

    spec:
         containers:
         - name: batch-container
           image: busybox:latest
           command: ["sh", "-c" , "echo hello && sleep 10"] 

