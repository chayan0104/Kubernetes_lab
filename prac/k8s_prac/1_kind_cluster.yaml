kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: apache-prod-lab

nodes:
  - role: control-plane
    image: kindest/node:v1.29.2
    extraMounts:
      - hostPath: ./storage/apache-data
        containerPath: /var/local/apache-data
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.29.2
    extraMounts:
      - hostPath: ./storage/apache-data
        containerPath: /var/local/apache-data
  - role: worker
    image: kindest/node:v1.29.2
    extraMounts:
      - hostPath: ./storage/apache-data
        containerPath: /var/local/apache-data
